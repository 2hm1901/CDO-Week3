# Cài External Secrets Operator từ manifest release chính thức.
# Apply file này bằng: kubectl apply -f https://github.com/external-secrets/external-secrets/releases/download/v0.10.7/external-secrets.yaml
# File này giữ URL/phiên bản để README và bootstrap manual có cùng nguồn tham chiếu.
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-secrets-install-note
  namespace: kube-system
data:
  install: "kubectl apply -f https://github.com/external-secrets/external-secrets/releases/download/v0.10.7/external-secrets.yaml"
