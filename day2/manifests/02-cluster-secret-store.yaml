# ClusterSecretStore cho phép ExternalSecret ở nhiều namespace dùng chung AWS provider.
# Credentials được đọc từ Secret aws-secretsmanager-creds trong namespace default,
# cùng namespace với ESO manifest v0.10.7.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secretsmanager-creds
            key: access-key
            namespace: default
          secretAccessKeySecretRef:
            name: aws-secretsmanager-creds
            key: secret-access-key
            namespace: default
