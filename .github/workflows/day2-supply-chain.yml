name: Day 2 Supply Chain Security

on:
  workflow_dispatch:
  push:
    paths:
      - "day2/app/**"
      - ".github/workflows/day2-supply-chain.yml"

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/day2-demo:${{ github.sha }}

jobs:
  scan-sign-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: day2/app
          load: true
          tags: ${{ env.IMAGE }}

      - name: Scan image with Trivy and fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: day2/app/.trivyignore

      - name: Push image after scan passes
        run: docker push "$IMAGE"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.6.0

      - name: Sign image with Cosign keyless
        run: cosign sign --yes "$IMAGE"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/day2-supply-chain.yml@refs/heads/.*" \
            "$IMAGE"
